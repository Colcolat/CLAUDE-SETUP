<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clawd Office</title>
<style>
  :root {
    --bg: #1c1a24;
    --panel: rgba(28, 26, 36, 0.82);
    --line: rgba(255, 255, 255, 0.10);
    --text: #f1ece4;
    --muted: #a49cae;
    --accent: #d97757;
    --gemini: #8ab4f8;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px); }
  #hud { top: 12px; left: 12px; max-width: calc(100vw - 48px); }
  #hud b { color: var(--accent); }
  #hud .sub { color: var(--muted); font-size: 12px; }
  #hud #gem { color: var(--gemini); display: none; }
  #dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #777; margin-right: 6px; vertical-align: middle; }
  #dot.on { background: #78dc8c; box-shadow: 0 0 6px #78dc8c; }
  #tasks { top: 12px; right: 12px; width: 250px; max-height: 45vh; overflow: auto; }
  #tasks h3, #feed h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted);
    font-weight: normal; text-transform: uppercase; letter-spacing: .08em; }
  #tasks ul { list-style: none; margin: 0; padding: 0; }
  #tasks li { padding: 3px 0; border-top: 1px solid var(--line); }
  #tasks li.done { color: var(--muted); text-decoration: line-through; }
  #tasks .empty { color: var(--muted); }
  #feed { left: 12px; bottom: 12px; width: min(460px, calc(100vw - 48px)); }
  #feed div.row { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #feed .time { color: var(--muted); margin-right: 6px; }
  .tag { text-align: center; pointer-events: none; transform: translateY(-4px);
    text-shadow: 0 1px 2px #000, 0 0 6px rgba(0, 0, 0, .6); white-space: nowrap; }
  .tag .nm { font-weight: bold; font-size: 13px; }
  .tag .act { font-size: 11px; color: #e8e2da; opacity: .9; }
  .zone { pointer-events: none; font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: rgba(255, 245, 230, .38); text-shadow: 0 1px 2px rgba(0, 0, 0, .5); }
  .bubble { pointer-events: none; background: #fffaf0; color: #2a2530; border-radius: 8px;
    padding: 4px 8px; font-size: 11px; max-width: 220px; white-space: normal;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .4); transform: translateY(-8px); }
  #err { display: none; top: 50%; left: 50%; transform: translate(-50%, -50%); }
  @media (max-width: 640px) {
    #tasks { display: none; }
    #feed { font-size: 11px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="scene"></div>
<div id="hud" class="panel">
  <div><span id="dot"></span><b>Clawd Office</b></div>
  <div class="sub" id="sess">waiting for events…</div>
  <div class="sub" id="gem"></div>
</div>
<div id="tasks" class="panel"><h3>Tasks</h3><ul id="tasklist"><li class="empty">no tasks</li></ul></div>
<div id="feed" class="panel"><h3>Activity</h3><div id="feedrows"></div></div>
<div id="err" class="panel">Couldn't load three.js (offline?).</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// Filled in by clawd.py from its ROLES registry.
const ROLES = /*ROLES*/null;
const ALIASES = /*ALIASES*/null;
const LABELS = /*LABELS*/null;
const GEM = { name: 'Gemini', icon: '✦', color: '#8ab4f8' };

const ORANGE = 0xd97757, EYE = 0x141418, WHITE = 0xebebeb, GLASS = 0xafd7fa, GOLD = 0xf0be3c;
const WOOD = 0x7a5236, DARK = 0x3a3a40;
const V = 0.5;        // one voxel, in world units
const WALK = 10;     // walking speed, world units per second
const GEMINI_STAYS = 180;  // seconds Gemini waits after a turn before leaving

const ACT_ICON = { reading: '🔍', typing: '⌨️', running: '▶', thinking: '💭', asking: '❓',
  delegating: '📤', working: '🛠', compacting: '🗜', done: '✅', sleeping: '💤', idle: '' };
const SCREEN = { reading: 0x6fb6ff, typing: 0x78dc8c, running: 0x3cff6e, thinking: 0x9b7bff,
  asking: 0xffd23c, delegating: 0xd97757, working: 0x5ad2d2, compacting: 0xff9a4a,
  done: 0x78dc8c, idle: 0x404050, sleeping: 0x202028 };

function roleFor(type) {
  const base = (type || '').split(':').pop();
  if (ROLES[base]) return base;
  return ALIASES[base] || 'ayudante';
}

// Name, icon and color for an agent: a Claude role, Gemini, or null for the lead.
function info(a) {
  if (!a) return null;
  if (a.kind === 'gemini') return GEM;
  return a.role ? ROLES[a.role] : null;
}

// ------------------------------------------------------------- scene

const host = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const labels = new CSS2DRenderer();
labels.domElement.style.position = 'absolute';
labels.domElement.style.top = '0';
labels.domElement.style.pointerEvents = 'none';
host.appendChild(labels.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1c1a24);
scene.fog = new THREE.Fog(0x1c1a24, 110, 200);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 300);
camera.position.set(0, 54, 64);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, -5);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.45;
controls.minDistance = 8;
controls.maxDistance = 130;
// Trackpads send small scroll steps: zoom faster, toward the cursor.
controls.zoomSpeed = 2.5;
controls.zoomToCursor = true;
// Arrow keys pan around the room.
controls.listenToKeyEvents(window);
controls.keyPanSpeed = 40;

scene.add(new THREE.HemisphereLight(0xfff1e0, 0x3a3048, 1.05));
const sun = new THREE.DirectionalLight(0xfff1dc, 1.4);
sun.position.set(18, 44, 26);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -48, right: 48, top: 48, bottom: -48, far: 140 });
scene.add(sun);

// Materials are shared by color. Plain ones (no extras) get merged at the end.
const mats = new Map(), plainMats = new Set();
function mat(color, extra) {
  const key = color + JSON.stringify(extra || {});
  if (!mats.has(key)) {
    const m = new THREE.MeshLambertMaterial({ color, ...extra });
    mats.set(key, m);
    if (!extra) plainMats.add(m);
  }
  return mats.get(key);
}
const glows = new Map();
function glowStatic(c) {  // shared, never changes color: merged too
  if (!glows.has(c)) glows.set(c, new THREE.MeshBasicMaterial({ color: c }));
  return glows.get(c);
}
const glowMat = c => new THREE.MeshBasicMaterial({ color: c });  // its own, may animate
const unit = new THREE.BoxGeometry(1, 1, 1);

// A box from (x0,y0,z0) to (x1,y1,z1), in units of `s`.
function box(parent, x0, x1, y0, y1, z0, z1, color, s = V, extra) {
  const m = new THREE.Mesh(unit, extra && extra.material ? extra.material : mat(color, extra));
  m.scale.set((x1 - x0) * s, (y1 - y0) * s, (z1 - z0) * s);
  m.position.set((x0 + x1) / 2 * s, (y0 + y1) / 2 * s, (z0 + z1) / 2 * s);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
// A slanted beam from (x0,y0) to (x1,y1), `w` thick, spanning z0..z1.
function beam(parent, x0, y0, x1, y1, z0, z1, w, material) {
  const m = new THREE.Mesh(unit, material);
  m.scale.set(Math.hypot(x1 - x0, y1 - y0), w, z1 - z0);
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.rotation.z = Math.atan2(y1 - y0, x1 - x0);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}
const P = (x, z) => new THREE.Vector3(x, 0, z);
const keep = o => { o.userData.keep = true; return o; };  // animated: never merge

function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'));
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
function rgba(hex, a) {
  const c = new THREE.Color(hex);
  return `rgba(${Math.round(c.r * 255)}, ${Math.round(c.g * 255)}, ${Math.round(c.b * 255)}, ${a})`;
}

// Static scenery goes in `world`, merged into a couple of meshes at the end.
const world = new THREE.Group();
scene.add(world);

// ------------------------------------------------------------- floor plan

// A 1-unit grid of what is taken: 1 furniture, 2 walkway. Decoration only
// goes where both are free, so nothing overlaps or blocks a path.
const GRID_X0 = -40, GRID_Z0 = -38, GRID_W = 80, GRID_H = 64;
const grid = new Uint8Array(GRID_W * GRID_H);
function markRect(x0, z0, x1, z1, v = 1) {
  for (let x = Math.floor(x0); x < Math.ceil(x1); x++) for (let z = Math.floor(z0); z < Math.ceil(z1); z++) {
    const i = x - GRID_X0, j = z - GRID_Z0;
    if (i >= 0 && j >= 0 && i < GRID_W && j < GRID_H) grid[j * GRID_W + i] |= v;
  }
}
function isFree(x0, z0, x1, z1) {
  for (let x = Math.floor(x0); x < Math.ceil(x1); x++) for (let z = Math.floor(z0); z < Math.ceil(z1); z++) {
    const i = x - GRID_X0, j = z - GRID_Z0;
    if (i < 0 || j < 0 || i >= GRID_W || j >= GRID_H || grid[j * GRID_W + i]) return false;
  }
  return true;
}
function markBox(obj, pad = 0.3) {
  obj.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(obj);
  markRect(b.min.x - pad, b.min.z - pad, b.max.x + pad, b.max.z + pad);
}
function markPath(pts, r) {
  for (let k = 1; k < pts.length; k++) {
    const a = pts[k - 1], b = pts[k], n = Math.ceil(a.distanceTo(b) * 2);
    for (let s = 0; s <= n; s++) {
      const p = a.clone().lerp(b, s / n);
      markRect(p.x - r, p.z - r, p.x + r, p.z + r, 2);
    }
  }
}

// Walkways: agents come in through the door and follow these aisles, so
// they never cut through furniture. Each desk is reached from its nearest node.
const OUT = P(-45, 10), IN = P(-35.5, 10);
const NODES = { in: IN, A: P(-22, 6), B: P(-22, -10), C: P(-12, -16), D: P(0, -18), E: P(12, -16),
  F: P(22, -10), G: P(22, 4), H: P(-14, 0), I: P(0, 0), J: P(14, 0) };
const EDGES = [['in', 'A'], ['A', 'H'], ['A', 'B'], ['B', 'C'], ['C', 'D'], ['D', 'E'], ['E', 'F'],
  ['F', 'J'], ['F', 'G'], ['H', 'I'], ['I', 'J'], ['J', 'G'], ['B', 'H'], ['C', 'H'], ['E', 'J']];
for (const [a, b] of EDGES) markPath([NODES[a], NODES[b]], 1.6);
markRect(-40, 7, -33, 13, 2);  // the doorway

// Shortest walk from the door to the node nearest `p` (Dijkstra on the aisles).
function route(p) {
  let goal = null;
  for (const k in NODES) if (k !== 'in' && (!goal || NODES[k].distanceTo(p) < NODES[goal].distanceTo(p))) goal = k;
  const dist = { in: 0 }, prev = {}, todo = new Set(Object.keys(NODES));
  while (todo.size) {
    let u = null;
    for (const k of todo) if (dist[k] !== undefined && (u === null || dist[k] < dist[u])) u = k;
    if (u === null || u === goal) break;
    todo.delete(u);
    for (const [a, b] of EDGES) {
      const v = a === u ? b : b === u ? a : null;
      if (!v || !todo.has(v)) continue;
      const d = dist[u] + NODES[u].distanceTo(NODES[v]);
      if (dist[v] === undefined || d < dist[v]) { dist[v] = d; prev[v] = u; }
    }
  }
  const out = [];
  for (let k = goal; k; k = prev[k]) out.unshift(NODES[k]);
  return out;  // starts at IN
}

// Where each role lives; the floor tint and the mixed decoration fade out from here.
const ANCHORS = [
  { key: 'explorador', x: -29.5, z: -22 }, { key: 'planificador', x: -16, z: -26 },
  { key: 'revisor', x: 0, z: -29 }, { key: 'seguridad', x: 16, z: -26 },
  { key: 'guia-tdd', x: 30.5, z: -22 }, { key: 'ayudante', x: -30, z: -2 },
  { key: 'gemini', x: 33.5, z: 14 },
];
const themeColor = k => k === 'gemini' ? GEM.color : ROLES[k].color;

// ------------------------------------------------------------- the attic

// Warm wooden planks.
const floorTex = canvasTexture(256, 256, g => {
  const tones = ['#b98d64', '#b0855c', '#a97e57', '#bf9469', '#a47a54'];
  for (let row = 0; row < 8; row++) {
    let x = -((row * 37) % 96), n = 0;
    while (x < 256) {
      const w = 70 + ((row * 13 + n * 29) % 60);
      g.fillStyle = tones[(row * 3 + n) % tones.length];
      g.fillRect(x, row * 32, w, 32);
      g.fillStyle = 'rgba(70, 40, 20, .35)';
      g.fillRect(x, row * 32, 2, 32);
      x += w; n++;
    }
    g.fillStyle = 'rgba(70, 40, 20, .3)';
    g.fillRect(0, row * 32, 256, 2);
  }
});
floorTex.wrapS = floorTex.wrapT = THREE.RepeatWrapping;
floorTex.repeat.set(7, 6);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(80, 64), new THREE.MeshLambertMaterial({ map: floorTex }));
floor.rotation.x = -Math.PI / 2;
floor.position.z = -6;
floor.receiveShadow = true;
scene.add(floor);

// A soft wash of each role's color over the floor, fading into its neighbors.
{
  const W = 640, H = 512, k = W / 80;
  const tint = canvasTexture(W, H, g => {
    const spot = (x, z, r, color, a) => {
      const cx = (x + 40) * k, cy = (z + 38) * k, rr = r * k;
      const grad = g.createRadialGradient(cx, cy, 0, cx, cy, rr);
      grad.addColorStop(0, rgba(color, a));
      grad.addColorStop(1, rgba(color, 0));
      g.fillStyle = grad;
      g.fillRect(cx - rr, cy - rr, rr * 2, rr * 2);
    };
    for (const a of ANCHORS) spot(a.x, a.z, 16, themeColor(a.key), 0.34);
    spot(0, -8.5, 11, '#f0be3c', 0.18);  // the lead's hub
    spot(0, 15, 13, '#d97757', 0.14);    // the lounge
  });
  const wash = new THREE.Mesh(new THREE.PlaneGeometry(80, 64),
    new THREE.MeshLambertMaterial({ map: tint, transparent: true, depthWrite: false }));
  wash.rotation.x = -Math.PI / 2;
  wash.position.set(0, 0.015, -6);
  wash.receiveShadow = true;
  scene.add(wash);
}

const WALL = 0xe6dacb, TRIM = 0x8a5a3a;
// Back wall: the attic's gable end.
{
  const s = new THREE.Shape();
  s.moveTo(-40.6, 0); s.lineTo(40.6, 0); s.lineTo(40.6, 8); s.lineTo(24, 18); s.lineTo(-24, 18); s.lineTo(-40.6, 8);
  const wall = new THREE.Mesh(new THREE.ExtrudeGeometry(s, { depth: 0.6, bevelEnabled: false }),
    new THREE.MeshLambertMaterial({ color: WALL }));
  wall.position.z = -38.6;
  wall.receiveShadow = true;
  scene.add(wall);
}
beam(world, -40.6, 8, -24, 18, -38.1, -37.6, 0.6, mat(TRIM));
beam(world, 40.6, 8, 24, 18, -38.1, -37.6, 0.6, mat(TRIM));
box(world, -24, 24, 17.7, 18.3, -38.1, -37.6, TRIM, 1);
box(world, -40, 40, 0, 0.6, -38.1, -37.9, 0x8a6a4e, 1);  // skirting
// A small square window high on the gable.
box(world, -2, 2, 11.5, 15.5, -38.05, -37.9, WOOD, 1);
box(world, -1.6, 1.6, 11.9, 15.1, -37.92, -37.86, 0x9fd0ff, 1, { emissive: 0x2a4a6a });
box(world, -0.1, 0.1, 11.9, 15.1, -37.86, -37.8, WHITE, 1);
box(world, -1.6, 1.6, 13.4, 13.6, -37.86, -37.8, WHITE, 1);

// Knee walls, 8 high, with the door on the left (z 7..13).
box(world, -40.6, -40, 0, 8, -38.6, 7, WALL, 1);
box(world, -40.6, -40, 0, 8, 13, 26, WALL, 1);
box(world, -40.6, -40, 7.4, 8, 7, 13, WALL, 1);
box(world, 40, 40.6, 0, 8, -38.6, 26, WALL, 1);
box(world, -40, -39.9, 0, 0.6, -38, 26, 0x8a6a4e, 1);
box(world, 39.9, 40, 0, 0.6, -38, 26, 0x8a6a4e, 1);
// The roof slopes in above them. Like a dollhouse, they only show from the
// inside: seen from above they are see-through, so nothing by the walls hides.
for (const d of [-1, 1]) {
  const x0 = d * 40.4, x1 = d * 33.4, y0 = 8, y1 = 12.4;
  const slope = new THREE.Mesh(new THREE.PlaneGeometry(64.6, Math.hypot(x1 - x0, y1 - y0)),
    new THREE.MeshLambertMaterial({ color: 0xa8744c }));
  slope.position.set((x0 + x1) / 2, (y0 + y1) / 2, -6.3);
  slope.lookAt(slope.position.clone().add(new THREE.Vector3(-d * (y1 - y0), -(Math.abs(x1 - x0)), 0)));
  scene.add(slope);
}

// The door the agents use.
box(world, -40.1, -39.7, 0, 7.6, 6.6, 7, WOOD, 1);
box(world, -40.1, -39.7, 0, 7.6, 13, 13.4, WOOD, 1);
box(world, -40.1, -39.7, 7.4, 7.8, 6.6, 13.4, WOOD, 1);
const door = keep(new THREE.Group());
door.position.set(-40.1, 0, 7);
world.add(door);
box(door, -0.15, 0.15, 0, 7.3, 0, 6, 0x9c6b45, 1);
box(door, 0.15, 0.35, 3.3, 3.6, 5.1, 5.5, GOLD, 1);
door.open = 0;
box(world, -39.6, -36.4, 0.01, 0.06, 7.6, 12.4, 0x6b4e3a, 1);  // doormat

// Windows with curtains: two on the back wall, one on the right.
for (const wx of [-26, 26]) {
  box(world, wx - 6, wx + 6, 3.5, 8.5, -38.05, -37.95, 0x9fd0ff, 1, { emissive: 0x2a4a6a });
  box(world, wx - 0.15, wx + 0.15, 3.5, 8.5, -37.95, -37.85, WHITE, 1);
  box(world, wx - 6.3, wx + 6.3, 3.3, 3.5, -38, -37.6, WOOD, 1);
  for (const cx of [wx - 7.2, wx + 6.2]) box(world, cx, cx + 1, 3, 9, -37.9, -37.5, 0xc96f4a, 1);
}
box(world, 39.95, 40.05, 3.5, 7.5, -6, 4, 0x9fd0ff, 1, { emissive: 0x2a4a6a });
box(world, 39.85, 39.95, 3.5, 7.5, -1.15, -0.85, WHITE, 1);
for (const cz of [-7.2, 4.2]) box(world, 39.5, 39.9, 3, 7.8, cz, cz + 1, 0xc96f4a, 1);
{
  const t = canvasTexture(512, 96, g => {
    g.fillStyle = '#2a2530'; g.fillRect(0, 0, 512, 96);
    g.fillStyle = '#d97757'; g.font = 'bold 56px Menlo, monospace';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('CLAWD & CO.', 256, 52);
  });
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(16, 3), new THREE.MeshBasicMaterial({ map: t }));
  sign.position.set(0, 6.3, -37.9);
  scene.add(sign);
}
// Framed art high on the gable.
function art(x, y, w, h, colors) {
  box(world, x - w / 2, x + w / 2, y, y + h, -37.95, -37.8, WOOD, 1);
  box(world, x - w / 2 + 0.2, x + w / 2 - 0.2, y + 0.2, y + h - 0.2, -37.8, -37.76, colors[0], 1);
  colors.slice(1).forEach((c, i) => {
    const x0 = x - w / 2 + 0.5 + i * (w - 1) / (colors.length - 1);
    box(world, x0, x0 + (w - 1) / (colors.length - 1) - 0.25, y + 0.5 + (i % 2) * 0.5, y + h - 0.6, -37.76, -37.73, c, 1);
  });
}
art(-14, 9.6, 4.2, 3, [0xf3e3c3, 0x4285f4, 0xd96570, 0x3cba8a]);
art(14, 9.6, 4.2, 3, [0x1e2a44, 0xffd27a, 0x9b72cb]);

// String lights along the gable and both knee walls.
{
  const C = [0xffd27a, 0xffb36b, 0xfff1c2, 0xff9d7a];
  let i = 0;
  const bulb = (x, y, z) => box(world, x - 0.2, x + 0.2, y - 0.35, y, z - 0.2, z + 0.2, 0, 1, { material: glowStatic(C[i++ % 4]) });
  for (let t = 0; t <= 1.001; t += 1 / 7) {
    bulb(-40 + 16 * t, 8.3 + 9.4 * t - 0.4 * Math.sin(t * Math.PI * 7), -37.4);

// A themed desk: a round rug that glows while someone works there, the desk
// and its decoration, all turned to face `rot` (0 faces the camera, PI/2
// faces right). The agent walks the aisles to the side nearer the room's
// center, and the decoration goes on the other side (local +x is mirrored).
function zone(key, x, z, decor, opts = {}) {
  const o = opts.info || ROLES[key];
  const root = new THREE.Group();
  root.position.set(x, 0, z);
  root.rotation.y = opts.rot || 0;
  world.add(root);
  root.updateMatrixWorld(true);
  const at = (lx, lz) => root.localToWorld(new THREE.Vector3(lx, 0, lz)).setY(0);
  const side = at(6.5, 4.5).length() < at(-6.5, 4.5).length() ? 1 : -1;
  const seatPos = at(0, -3.3), approach = at(side * 6.5, 4.5);
  const path = [OUT, ...route(approach), approach, at(side * 6.5, -3.3), seatPos];
  const rugMat = new THREE.MeshLambertMaterial({
    color: new THREE.Color(o.color).lerp(new THREE.Color(0x7a5a44), 0.45),
    emissive: new THREE.Color(o.color), emissiveIntensity: 0 });
  const rug = new THREE.Mesh(new THREE.CircleGeometry(5.2, 28), rugMat);
  rug.rotation.x = -Math.PI / 2;
  rug.position.set(0, 0.04, -1.8);
  rug.receiveShadow = true;
  root.add(rug);
  const seat = { key, desk: makeDesk(0, 0, opts.w || 8, opts.top, root), seatPos, face: root.rotation.y,
    path, rugMat, agent: null };
  const g = new THREE.Group();
  g.scale.x = -side;
  root.add(g);
  decor(g, fn => decorAnim.push(t => fn(t, seat)));
  if (opts.lamp !== false) deskLamp(g, opts.lampX ?? -3.2, -0.7);
  markBox(root);
  markPath(path.slice(-3), 1.2);
  zoneLabel(o.icon + ' ' + (opts.label || o.name), at(0, 4.4));
  seats[key] = seat;
  return seat;
}

{

  for (let x = -37.5; x <= 37.5; x += 2.5) for (let z = -35.5; z <= 23.5; z += 2.5) {

    if (!byWall && !ring) continue;

// Thousands of boxes become a couple of meshes: everything static with a
// shared plain material is baked into one geometry with vertex colors.
function mergeStatic(root) {
  root.updateMatrixWorld(true);
  const lit = [], bright = [], done = [];
  root.traverse(o => {
    if (!o.isMesh) return;
    for (let p = o; p; p = p.parent) if (p.userData.keep) return;
    const isLit = plainMats.has(o.material), isBright = [...glows.values()].includes(o.material);
    if (!isLit && !isBright) return;
    const g = o.geometry.clone().applyMatrix4(o.matrixWorld);
    if (o.matrixWorld.determinant() < 0) {  // mirrored: flip the triangles back
      const idx = g.index.array;
      for (let i = 0; i < idx.length; i += 3) { const t = idx[i + 1]; idx[i + 1] = idx[i + 2]; idx[i + 2] = t; }
    }
    const c = o.material.color, n = g.attributes.position.count, col = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) { col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b; }
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    (isLit ? lit : bright).push(g);
    done.push(o);
  });
  for (const o of done) o.parent.remove(o);
  if (lit.length) {
    const m = new THREE.Mesh(mergeGeometries(lit), new THREE.MeshLambertMaterial({ vertexColors: true }));
    m.castShadow = m.receiveShadow = true;
    scene.add(m);
  }
  if (bright.length) scene.add(new THREE.Mesh(mergeGeometries(bright), new THREE.MeshBasicMaterial({ vertexColors: true })));
}
mergeStatic(world);

// Voxel Clawd, facing +z. Body x -6..6, y 2..9, z -3.5..3.5; legs below.
function makeClawd(role) {
  const o = role ? ROLES[role] : null;
  const root = new THREE.Group();
  const body = new THREE.Group();
  root.add(body);
  const hat = o ? new THREE.Color(o.hat).getHex() : 0;
  const color = o ? new THREE.Color(o.color).getHex() : 0;
  const kind = o ? o.outfit : null;

  box(body, -6, 6, 2, 9, -3.5, 3.5, ORANGE);
  const legs = [-6, -4, 3, 5].map(x => box(root, x, x + 1, 0, 2, -2.5, 2.5, ORANGE));

  const eyes = new THREE.Group();
  body.add(eyes);
  const ez = kind === 'coat' ? 4.05 : 3.5;
  box(eyes, -4, -3, 6, 8, ez, ez + 0.2, EYE);
  box(eyes, 3, 4, 6, 8, ez, ez + 0.2, EYE);

  const sleeve = kind === 'coat' ? WHITE : ORANGE;
  const arm = side => {
    const p = new THREE.Group();
    p.position.set(side * 6 * V, 5 * V, 0);
    body.add(p);
    if (side < 0) box(p, -2, 0, -1, 0, -1, 1, sleeve);
    else box(p, 0, 2, -1, 0, -1, 1, sleeve);
    return p;
  };
  const armL = arm(-1), armR = arm(1);

  if (kind === 'hat') {
    if (o.brim && role === 'planificador') {  // hard hat with a ridge
      box(body, -5, 5, 9, 11.5, -3, 3, hat);
      box(body, -1, 1, 11.5, 12, -3.2, 3.2, hat);
      box(body, -6.5, 6.5, 9, 9.6, -4, 5.5, hat);
    } else {  // safari hat with a dark band
      box(body, -5, 5, 9, 11, -3, 3, hat);
      box(body, -5.1, 5.1, 9.6, 10.2, -3.1, 3.1, 0x6b5432);
      box(body, -7.5, 7.5, 9, 9.5, -4.5, 4.5, hat);
    }
  } else if (kind === 'glasses') {
    const lens = mat(GLASS, { transparent: true, opacity: 0.55 });
    for (const lx of [-5, 2]) {
      box(body, lx, lx + 3, 5, 8, 3.5, 3.9, 0, V, { material: lens });
      box(body, lx - 0.15, lx + 3.15, 7.85, 8.15, 3.5, 3.95, 0x55555c);
      box(body, lx - 0.15, lx + 3.15, 4.85, 5.15, 3.5, 3.95, 0x55555c);
    }
    box(body, -2, 2, 7, 7.4, 3.6, 3.9, 0x7896b4);
    box(body, -6.2, -6, 7, 7.4, -3, 3.6, 0x55555c);
    box(body, 6, 6.2, 7, 7.4, -3, 3.6, 0x55555c);
  } else if (kind === 'guard') {
    box(body, -6.2, 6.2, 8.4, 10.4, -3.7, 3.7, hat);
    box(body, -5, 5, 8.4, 8.9, 3.7, 6, hat);
    box(body, -1, 1, 9, 10, 3.7, 3.8, GOLD);  // cap badge
    for (const lx of [-5, 2]) box(body, lx, lx + 3, 6, 7.6, 3.5, 3.9, 0x111114);
    box(body, -2, 2, 7, 7.4, 3.5, 3.85, 0x111114);
    box(body, -1, 1, 3.5, 5.2, 3.5, 3.8, GOLD);  // chest badge
  } else if (kind === 'coat') {
    box(body, -6.2, 6.2, 2, 5.5, -3.7, 3.7, WHITE);
    box(body, -0.3, 0.3, 2, 5.5, 3.7, 3.8, 0xcfcfcf);
    box(body, -6.15, 6.15, 6.6, 7.4, -3.65, 3.65, 0x2e6e3e);
    const lens = mat(0x78dc8c, { transparent: true, opacity: 0.6 });
    for (const lx of [-5, 2]) box(body, lx, lx + 3, 5.6, 8.4, 3.5, 4.1, 0, V, { material: lens });
  } else if (kind === 'band') {
    box(body, -6.15, 6.15, 7.8, 8.8, -3.65, 3.65, hat);
    box(body, 6, 7.4, 7.6, 9, -2.8, -1.6, hat);
    box(body, 7, 8.2, 6.6, 7.6, -2.6, -1.8, hat);
  } else if (!role) {  // the lead wears a little crown
    box(body, -4, 4, 9, 9.8, -2, 2, GOLD);
    for (const cx of [-4, -0.5, 3]) box(body, cx, cx + 1, 9.8, 11, -0.5, 0.5, GOLD);
  }

  return { root, body, eyes, armL, armR, legs, color };
}

// Gemini: a floating four-pointed star, blue to purple, with a little face.
function makeGemini() {
  const root = new THREE.Group(), body = new THREE.Group();

  root.add(body);
  body.add(star, eyes);

  const blue = glowing(0x4285f4), mid = glowing(0x7b8cf0), purple = glowing(0x9b72cb), core = glowing(0xa8c7fa);
  box(star, -1.5, 1.5, -1.5, 1.5, -0.8, 0.8, 0, V, { material: core });
  const tiers = [[1.0, 1.5, 2.8, 0.7], [0.6, 2.8, 3.9, 0.5], [0.25, 3.9, 4.8, 0.3]];

      if (dx === 0) box(star, -hw, hw, lo, hi, -hz, hz, 0, V, { material: m });
      else box(star, lo, hi, -hw, hw, -hz, hz, 0, V, { material: m });
    }
  }
  box(eyes, -0.9, -0.4, -0.1, 0.9, 0.8, 1.0, EYE);
  box(eyes, 0.4, 0.9, -0.1, 0.9, 0.8, 1.0, EYE);
  box(eyes, -1.4, -0.9, -0.7, -0.4, 0.8, 0.95, 0xf4a3c0);
  box(eyes, 0.9, 1.4, -0.7, -0.4, 0.8, 0.95, 0xf4a3c0);
  return { root, body, star, eyes, armL: new THREE.Group(), armR: new THREE.Group(), legs: [],
    color: 0x8ab4f8, starMats: [blue, mid, purple, core] };
}

// ------------------------------------------------------------- agents

const agents = new Map();   // agent id -> agent
const retired = new Set();  // stopped agent ids, so late hooks don't revive them
const fx = [];              // sparkles, envelopes, bubbles in flight
let main = null;

function tagEl() {
  const el = document.createElement('div');
  el.className = 'tag';
  el.innerHTML = '<div class="nm"></div><div class="act"></div>';
  return el;
}

function setTag(a) {
  if (a.act !== a.shownAct) { a.shownAct = a.act; a.actAt = now(); }
  const nm = a.tagEl.firstChild, act = a.tagEl.lastChild;
  const o = info(a);
  let title = '👑 Claude';
  if (a.kind === 'gemini') title = GEM.icon + ' Gemini' + (a.proj ? ' · ' + a.proj : '');
  else if (o) title = o.icon + ' ' + ((a.name || a.nick) ? (a.name || a.nick) + ' · ' + o.name : o.name);
  nm.textContent = title;
  nm.style.color = o ? o.color : '#f0be3c';
  const label = LABELS[a.act] || a.act || '';
  act.textContent = [ACT_ICON[a.act] || '', label, a.detail ? '· ' + a.detail : '']
    .filter(Boolean).join(' ');
}

// Subagents Claude didn't name still get a person's name for the office,
// picked from their role's list and never shared with a colleague in the room.
const NICKS = {
  explorador: ['vale', 'nico', 'ines', 'joel'], planificador: ['pablo', 'ana', 'tomas', 'irene'],
  revisor: ['sofia', 'diego', 'clara', 'raul'], seguridad: ['bruno', 'elena', 'hugo', 'marta'],
  'guia-tdd': ['lucia', 'marco', 'paula', 'iker'], ayudante: ['mateo', 'rosa', 'leo', 'alba'],
};
function nickFor(role, id) {
  const list = NICKS[role] || NICKS.ayudante;
  const taken = new Set([...agents.values()].map(a => a.name || a.nick));
  let h = 0;
  for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  for (let k = 0; k < list.length; k++) {
    const n = list[(h + k) % list.length];
    if (!taken.has(n)) return n;
  }
  return list[h % list.length] + ' ' + (h % 9 + 2);
}

function createAgent(id, role, name, seat, instant, proj) {
  const gem = role === 'gemini';
  const c = gem ? makeGemini() : makeClawd(role);
  const a = { id, role: gem ? null : role, kind: gem ? 'gemini' : 'clawd', name, seat, proj,
    act: role ? 'thinking' : 'idle', detail: '', ...c, hop: -10, spinY: -10, seen: Date.now() / 1000,
    walk: null, seated: false, leaveAt: null, leaving: false, heading: 0, spin: 0 };
  if (!gem && role && !name) a.nick = nickFor(role, id);
  seat.agent = a;
  scene.add(a.root);
  a.tagEl = tagEl();
  const tag = new CSS2DObject(a.tagEl);
  tag.position.set(0, (gem ? 12.5 : role ? 13 : 13.5) * V, 0);
  a.root.add(tag);
  a.tag = tag;
  if (instant || !seat.path.length) {
    a.root.position.copy(seat.seatPos);
    a.root.rotation.y = gem ? 0 : seat.face || 0;
    a.seated = true;
  } else {
    a.root.position.copy(seat.path[0]);
    a.walk = { pts: seat.path.slice(1), i: 0, dir: 'in' };
    poof(IN, a.color || ORANGE, 8);
  }
  if (seat.desk) seat.desk.logoMat.color.set(a.color || GOLD);
  setTag(a);
  agents.set(id, a);
  showGemini();
  return a;
}

function ensureMain() {
  if (!main) main = createAgent('main', null, 'Claude', leadSeat, true);
  return main;
}

function ensureAgent(e, instant) {
  if (e.agent === 'main' || !e.agent) return ensureMain();
  if (agents.has(e.agent)) return agents.get(e.agent);
  if (e.ev === 'spawn') retired.delete(e.agent);  // a new arrival always counts
  if (retired.has(e.agent)) return null;
  if (e.src === 'gemini') return createAgent(e.agent, 'gemini', null, pickSeat('gemini'), instant, e.proj);
  if (!(e.type || e.name)) return null;  // internal helpers have no type
  const role = e.type ? roleFor(e.type) : 'ayudante';
  return createAgent(e.agent, role, e.name, pickSeat(role), instant);
}

function freeSeat(a) {
  if (a.seat.agent !== a) return;
  a.seat.agent = null;
  if (a.seat.desk) a.seat.desk.logoMat.color.set(0x555560);
}

function removeAgent(a) {
  scene.remove(a.root);
  a.tag.element.remove();
  freeSeat(a);
  agents.delete(a.id);
  showGemini();
}

// Walk back out the way it came in, from wherever it is now.
function startLeave(a) {
  a.leaveAt = null;
  a.leaving = true;
  freeSeat(a);
  const path = a.seat.path;
  const back = a.walk && a.walk.dir === 'in' ? path.slice(0, a.walk.i + 1) : path.slice(0, -1);
  a.walk = { pts: back.reverse(), i: 0, dir: 'out' };
  a.seated = false;
}

function reset() {
  for (const a of [...agents.values()]) removeAgent(a);
  main = null;
  retired.clear();
  tasks.clear();
  for (const f of fx.splice(0)) f.dispose();
  feedRows.textContent = '';
  renderTasks();
  ensureMain();
}

function byName(name) {
  if (!name) return null;
  const n = String(name).toLowerCase();
  if (['main', 'lead', 'team-lead', 'leader', 'claude', 'parent'].includes(n)) return ensureMain();
  for (const a of agents.values()) {
    if (a.id === name || (a.name || '').toLowerCase() === n) return a;
  }
  for (const a of agents.values()) if (a.role === roleFor(n) && ROLES[n.split(':').pop()]) return a;
  return null;
}

const gemEl = document.getElementById('gem');
function showGemini() {
  const g = [...agents.values()].find(a => a.kind === 'gemini');
  gemEl.style.display = g ? 'block' : 'none';
  gemEl.textContent = g ? '✦ Gemini' + (g.proj ? ' · ' + g.proj : '') : '';
}

// ------------------------------------------------------------- effects

const clock = new THREE.Clock();
const now = () => clock.getElapsedTime();

function poof(pos, color, n = 18) {
  for (let i = 0; i < n; i++) {
    const m = new THREE.Mesh(unit, new THREE.MeshBasicMaterial({
      color: i % 3 ? 0xffe680 : color, transparent: true }));
    m.scale.setScalar(0.22);
    m.position.set(pos.x, 1.6, pos.z);
    const v = new THREE.Vector3((Math.random() - .5) * 6, Math.random() * 5 + 2, (Math.random() - .5) * 6);
    scene.add(m);
    const t0 = now();
    fx.push({
      step(t) {
        const k = (t - t0) / 0.9;
        m.position.addScaledVector(v, 1 / 60);
        v.y -= 0.25;
        m.material.opacity = 1 - k;
        return k < 1;
      },
      dispose() { scene.remove(m); m.material.dispose(); },
    });
  }
}

const envGeo = new THREE.BoxGeometry(1, 0.08, 0.66);
function envelope(from, to, text) {
  const g = new THREE.Group();
  const m = new THREE.Mesh(envGeo, mat(0xfffaf0));
  m.castShadow = true;
  g.add(m);
  box(g, -0.12, 0.12, 0.04, 0.09, -0.12, 0.12, 0xd9363e, 1);
  g.scale.setScalar(1.4);
  scene.add(g);
  const a = from.root.position.clone().setY(3.4);
  const b = to === main ? TRAY.clone() : to.root.position.clone().setY(3.4);
  from.flashAt = now();
  const dur = Math.max(1.0, a.distanceTo(b) / 14);
  const t0 = now();
  from.hop = t0;
  fx.push({
    step(t) {
      const k = Math.min(1, (t - t0) / dur);
      g.position.lerpVectors(a, b, k);
      g.position.y += Math.sin(Math.PI * k) * (3 + a.distanceTo(b) * 0.15);
      g.rotation.y = t * 6;
      g.rotation.z = Math.sin(t * 9) * 0.3;
      if (k >= 1) {
        to.hop = t;
        if (text) bubble(to, '📨 ' + text);
        if (to === main) trayLetter();
        return false;
      }
      return true;
    },
    dispose() { scene.remove(g); },
  });
}

// A letter resting in Claude's tray for a while.
const trayLetters = [];
function trayLetter() {
  const g = new THREE.Group();
  g.add(new THREE.Mesh(envGeo, mat(0xfffaf0)));
  box(g, -0.12, 0.12, 0.04, 0.09, -0.12, 0.12, 0xd9363e, 1);
  g.position.copy(TRAY).setY(TRAY.y + trayLetters.length * 0.1);
  g.rotation.y = (Math.random() - 0.5) * 0.5;
  scene.add(g);
  trayLetters.push(g);
  const t0 = now();
  fx.push({
    step(t) { return t - t0 < 10; },
    dispose() { scene.remove(g); trayLetters.splice(trayLetters.indexOf(g), 1); },
  });
}

function bubble(a, text, secs = 4) {
  const el = document.createElement('div');
  el.className = 'bubble';
  el.textContent = text;
  const obj = new CSS2DObject(el);
  obj.position.set(0, 17 * V, 0);
  a.root.add(obj);
  const t0 = now();
  fx.push({
    step(t) { return t - t0 < secs && agents.get(a.id) === a; },
    dispose() { a.root.remove(obj); el.remove(); },
  });
}

// ------------------------------------------------------------- tasks & feed

const tasks = new Map();
const taskList = document.getElementById('tasklist');
function renderTasks() {
  taskList.textContent = '';
  if (!tasks.size) {
    taskList.innerHTML = '<li class="empty">no tasks</li>';
    return;
  }
  for (const t of tasks.values()) {
    const li = document.createElement('li');
    li.className = t.done ? 'done' : '';
    li.textContent = (t.done ? '✓ ' : '□ ') + (t.subject || t.id) + (t.who ? ' — ' + t.who : '');
    taskList.appendChild(li);
  }
}

const feedRows = document.getElementById('feedrows');
function feed(e, a, text) {
  const row = document.createElement('div');
  row.className = 'row';
  const time = document.createElement('span');
  time.className = 'time';
  time.textContent = new Date(e.t * 1000).toLocaleTimeString('en-GB');
  const who = document.createElement('span');
  const o = info(a);
  who.style.color = o ? o.color : '#f0be3c';
  who.textContent = a ? (a.kind === 'gemini' ? 'Gemini' : a.name || a.nick || (o ? o.name : 'Claude')) : '?';
  row.append(time, who, document.createTextNode(' ' + text));
  feedRows.prepend(row);
  while (feedRows.children.length > 7) feedRows.lastChild.remove();
}

// ------------------------------------------------------------- events

let project = '';
function apply(e, instant) {
  const gem = e.src === 'gemini';
  if (!gem && e.proj && e.proj !== project) {
    project = e.proj;
    showSession();
  }
  const a = ['task', 'task-done', 'idle'].includes(e.ev)
    ? (e.agent && e.agent !== 'main' ? ensureAgent(e, instant) : byName(e.name) || ensureMain())
    : ensureAgent(e, instant);
  if (a) a.seen = e.t;
  // Gemini stays while its conversation is alive; a new step cancels its exit.
  if (a && gem && !a.leaving && !(e.ev === 'state' && e.state === 'done')) a.leaveAt = null;

  switch (e.ev) {
    case 'spawn':
      if (!a) return;
      if (e.name) a.name = e.name;
      a.act = 'thinking';
      a.detail = e.desc || '';
      setTag(a);
      if (!instant) feed(e, a, (gem ? 'opens a conversation' : 'arrives at the office') + (e.desc ? ': ' + e.desc : ''));
      if (!gem) {
        ensureMain().act = 'delegating';
        setTag(main);
      }
      break;
    case 'stop':
      if (!a || a === main) return;
      retired.add(a.id);
      if (instant) { removeAgent(a); return; }
      a.act = 'done';
      a.detail = '';
      setTag(a);
      envelope(a, ensureMain(), e.report);
      a.leaveAt = now() + (a.seated ? 1.8 : 0);
      feed(e, a, 'is done and hands in the report');
      break;
    case 'tool':
      if (!a) return;
      a.act = e.activity || 'working';
      a.detail = e.detail || e.tool || '';
      setTag(a);
      if (!instant && a !== main) feed(e, a, (ACT_ICON[a.act] || '') + ' ' + e.tool + (e.detail ? ' ' + e.detail : ''));
      break;
    case 'state':
      if (!a) return;
      if (a === main && e.state === 'start' && ['startup', 'clear'].includes(e.source)) {
        for (const b of [...agents.values()]) if (b !== main && b.kind !== 'gemini') removeAgent(b);
        retired.clear();
        tasks.clear();
        renderTasks();
      }
      a.act = e.state === 'start' ? 'idle' : e.state;
      if (a.act !== 'thinking' || a === main) a.detail = '';
      setTag(a);
      if (gem && e.state === 'done') {
        a.spinY = now();
        if (!a.leaving) a.leaveAt = now() + GEMINI_STAYS;
        if (!instant) feed(e, a, 'finished a turn');
      }
      break;
    case 'msg': {
      if (!a) return;
      const targets = e.to === '*' ? [...agents.values()].filter(b => b !== a)
        : [byName(e.to) || ensureMain()];
      if (!instant) for (const b of targets) if (b !== a) envelope(a, b, e.summary);
      if (!instant) feed(e, a, '✉️ → ' + (e.to || 'Claude') + (e.summary ? ': ' + e.summary : ''));
      break;
    }
    case 'task':
      tasks.set(e.id, { id: e.id, subject: e.subject, who: e.name, done: false });
      renderTasks();
      if (!instant && a) { a.hop = now(); bubble(a, '📝 ' + (e.subject || 'new task'), 3); }
      break;
    case 'task-done': {
      const t = tasks.get(e.id) || { id: e.id, subject: e.subject, who: e.name };
      t.done = true;
      tasks.set(e.id, t);
      renderTasks();
      if (!instant && a) { a.hop = now(); bubble(a, '✅ ' + (e.subject || 'task done'), 3); }
      break;
    }
    case 'idle':
      if (!a) return;
      a.act = 'sleeping';
      a.detail = '';
      setTag(a);
      break;
    case 'end':
      for (const b of [...agents.values()]) if (b !== main && b.kind !== 'gemini') removeAgent(b);
      ensureMain().act = 'sleeping';
      setTag(main);
      break;
  }
}

// ------------------------------------------------------------- animation

// Move along the walk path. Returns true when the agent left the office.
function stepWalk(a, dt) {
  const w = a.walk, p = a.root.position;
  let step = WALK * dt;
  while (step > 0 && w.i < w.pts.length) {
    const target = w.pts[w.i];
    const dx = target.x - p.x, dz = target.z - p.z, d = Math.hypot(dx, dz);
    if (d <= step) {
      p.x = target.x; p.z = target.z; step -= d; w.i++;
    } else {
      p.x += dx / d * step; p.z += dz / d * step; step = 0;
      a.heading = Math.atan2(dx, dz);
    }
  }
  if (w.i < w.pts.length) return false;
  a.walk = null;
  if (w.dir === 'out') { removeAgent(a); return true; }
  a.seated = true;
  return false;
}

const turn = (from, to) => from + Math.atan2(Math.sin(to - from), Math.cos(to - from));

function animate(a, t, dt) {
  if (a.leaveAt !== null && t >= a.leaveAt && !a.leaving) startLeave(a);
  if (a.walk && stepWalk(a, dt)) return;
  const walking = !!a.walk;

  // Shrink while slipping out through the door.
  let s = 1;
  if (a.leaving && walking) s = Math.min(1, a.root.position.distanceTo(OUT) / 4);
  a.root.scale.setScalar(Math.max(0.01, s));

  // Like the status line: the lead's "done" fades to idle, then to sleep.
  if (a === main && ((a.act === 'done' && t - a.actAt > 6) || (a.act === 'idle' && t - a.actAt > 180))) {
    a.act = a.act === 'done' ? 'idle' : 'sleeping';
    setTag(a);
  }
  // Clawds turn to where they walk; the star always faces the room.
  const k = Math.min(1, dt * 10), heading = a.kind === 'gemini' ? 0 : walking ? a.heading : a.seat.face || 0;
  a.root.rotation.y += (turn(a.root.rotation.y, heading) - a.root.rotation.y) * k;

  if (a.kind === 'gemini') animateGemini(a, t, dt, walking);
  else animateClawd(a, t, walking);

  // The desk follows its agent: lid open, screen, glow and rug by activity.
  const d = a.seat.desk;
  if (!d || !a.seated || a.seat.agent !== a) return;
  const act = a.act;
  d.open += ((act === 'sleeping' ? 0.4 : 1) - d.open) * 0.1;
  let c = SCREEN[act] ?? SCREEN.working;
  if (act === 'running' && Math.sin(t * 10) > 0.6) c = 0xffffff;
  d.screenMat.color.setHex(c);
  d.glow.color.setHex(c);
  d.glow.intensity = act === 'sleeping' ? 0.2 : act === 'typing' ? 2.4 + Math.sin(t * 20) * 0.6 : 2;
}

function animateClawd(a, t, walking) {
  const act = a.act;
  let y = 0, ry = 0, la = 0, ra = 0, ex = 0, ey = 0, blink = 1;
  const lift = [0, 0, 0, 0];
  if (walking) {
    const ph = Math.sin(t * 11);
    y = Math.abs(ph) * 0.14;
    la = ph * 0.35; ra = ph * 0.35;
    lift[0] = lift[3] = Math.max(0, ph) * 0.35;
    lift[1] = lift[2] = Math.max(0, -ph) * 0.35;
  } else if (act === 'thinking' || act === 'compacting') {
    y = Math.sin(t * 2) * 0.06; ey = 0.5 * V; ex = Math.round(Math.sin(t * 1.3)) * V;
  } else if (act === 'reading') {
    ex = Math.round(Math.sin(t * 2.5)) * V; ry = Math.sin(t * 1.2) * 0.12;
  } else if (act === 'typing') {
    la = Math.sin(t * 22) * 0.35 + 0.5; ra = -Math.sin(t * 22 + 1.5) * 0.35 - 0.5; ey = -0.5 * V;
  } else if (act === 'running') {
    y = Math.abs(Math.sin(t * 8)) * 0.1; ey = -0.5 * V; la = 0.4; ra = -0.4;
  } else if (act === 'delegating') {
    la = -0.6 + Math.sin(t * 4) * 0.4; ry = Math.sin(t * 0.8) * 0.4;
  } else if (act === 'asking') {
    ra = 1.2 + Math.sin(t * 8) * 0.4;
  } else if (act === 'done') {
    y = Math.abs(Math.sin(t * 7)) * 0.7; la = -1.2; ra = 1.2;
  } else if (act === 'sleeping') {
    blink = 0.15; y = -0.08 + Math.sin(t * 1.2) * 0.04;
  } else if (act === 'working') {
    la = -Math.abs(Math.sin(t * 6)) * 0.9; ry = Math.sin(t * 3) * 0.05;
  }
  if (act !== 'sleeping' && (t % 4.3) < 0.12) blink = 0.15;
  const hop = t - a.hop;
  if (hop < 0.5) y += Math.sin(Math.PI * hop / 0.5) * 0.9;

  a.body.position.y = y;
  a.body.rotation.y = ry;
  a.armL.rotation.z = la;
  a.armR.rotation.z = ra;
  a.eyes.position.set(ex, ey, 0);
  a.eyes.scale.y = blink;
  a.legs.forEach((l, i) => { l.position.y = V + lift[i]; });
}

function animateGemini(a, t, dt, walking) {
  const act = a.act;
  const speed = walking ? 1.5 : act === 'typing' || act === 'running' ? 2.6 : act === 'thinking' ? 0.9 : 0.4;
  a.spin += dt * speed;
  a.star.rotation.z = a.spin;
  let y = 2.9 + Math.sin(t * 1.8) * 0.25;
  const hop = t - a.hop;
  if (hop < 0.5) y += Math.sin(Math.PI * hop / 0.5) * 0.9;
  a.body.position.y = y;
  const flip = t - a.spinY;  // a full turn when a turn finishes
  a.body.rotation.y = flip < 1 ? flip * Math.PI * 2 : 0;
  const glow = act === 'thinking' ? 0.45 + 0.25 * Math.sin(t * 4) : walking ? 0.3 : 0.25;
  for (const m of a.starMats) m.emissiveIntensity = glow;
  a.eyes.position.x = act === 'reading' ? Math.round(Math.sin(t * 2.5)) * 0.15 : 0;
  a.eyes.scale.y = (t % 3.7) < 0.12 ? 0.15 : 1;
}

const WHITE_C = new THREE.Color(0xffffff), DIM_C = new THREE.Color(0x2a2a30);

// Double-click an agent to fly the camera over to it.
let focus = null;
{
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  renderer.domElement.addEventListener('dblclick', ev => {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const list = [...agents.values()];
    const hit = ray.intersectObjects(list.map(a => a.root), true)[0];
    if (!hit) return;
    const a = list.find(b => { for (let p = hit.object; p; p = p.parent) if (p === b.root) return true; return false; });
    const to = a.root.position.clone().setY(2);
    const offset = camera.position.clone().sub(controls.target).setLength(24);
    focus = { t0: now(), fromT: controls.target.clone(), toT: to,
      fromC: camera.position.clone(), toC: to.clone().add(offset) };
  });
}

let last = 0;
function frame() {
  requestAnimationFrame(frame);
  // Background tabs get few frames: take bigger steps so agents keep up.
  const t = now(), dt = Math.min(0.25, t - last);
  last = t;
  for (const a of [...agents.values()]) animate(a, t, dt);
  for (const seat of allSeats) {
    const a = seat.agent, here = a && a.seated && !a.leaving;
    if (seat.rugMat) seat.rugMat.emissiveIntensity += ((here ? 0.22 : 0) - seat.rugMat.emissiveIntensity) * 0.08;
    const d = seat.desk;
    if (!d) continue;
    // Open and tilted back when someone sits there, shut when the desk is free.
    const target = here ? -Math.PI / 2 + (Math.PI / 2 + 0.3) * d.open : -Math.PI / 2 + 0.03;
    d.hinge.rotation.x += (target - d.hinge.rotation.x) * 0.12;
    if (!here) { d.glow.intensity = 0; d.screenMat.color.setHex(SCREEN.sleeping); d.open = 0; }
  }
  for (const f of decorAnim) f(t);
  // The team board: each role's light is on while one of its agents works,
  // and flickers when that agent sends a message.
  for (const [key, l] of Object.entries(boardLamps)) {
    const a = [...agents.values()].find(b => !b.leaving && (key === 'gemini' ? b.kind === 'gemini' : b.role === key));
    const flash = a && t - (a.flashAt ?? -10) < 0.8 && Math.sin(t * 30) > 0;
    l.mat.color.copy(flash ? WHITE_C : a ? l.color : DIM_C);
  }
  // Beams and hanging plants fade away as the camera comes close.
  const dist = camera.position.distanceTo(controls.target);
  const fade = THREE.MathUtils.clamp((dist - 30) / 45, 0.06, 0.9);
  for (const m of fadeMats) { m.opacity = fade; m.depthWrite = fade > 0.98; }
  roof.visible = fade > 0.07;
  if (focus) {
    const k = Math.min(1, (t - focus.t0) / 0.7), e = 1 - Math.pow(1 - k, 3);
    controls.target.lerpVectors(focus.fromT, focus.toT, e);
    camera.position.lerpVectors(focus.fromC, focus.toC, e);
    if (k >= 1) focus = null;
  }
  // The door swings open while someone walks through it.
  const near = [...agents.values()].some(a => a.walk && a.root.position.distanceTo(IN) < 7);
  door.open += ((near ? 1 : 0) - door.open) * 0.12;
  door.rotation.y = door.open * 1.5;
  for (let i = fx.length - 1; i >= 0; i--) {
    if (!fx[i].step(t)) { fx[i].dispose(); fx.splice(i, 1); }
  }
  controls.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
}

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  labels.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
ensureMain();
frame();

// ------------------------------------------------------------- live log

const dot = document.getElementById('dot');
const sess = document.getElementById('sess');
let session = null;
function showSession() {
  if (!session) { sess.textContent = 'waiting for a Claude Code session…'; return; }
  sess.textContent = (project ? project + ' · ' : '') + 'session ' + session.sid.slice(0, 8) +
    (session.pinned ? '' : ' (latest)');
}

const sid = new URLSearchParams(location.search).get('s') || '';
const src = new EventSource('/events' + (sid ? '?s=' + encodeURIComponent(sid) : ''));
src.onopen = () => dot.classList.add('on');
src.onerror = () => dot.classList.remove('on');
src.addEventListener('session', m => {
  const s = JSON.parse(m.data);
  session = s.sid ? s : null;
  project = '';
  reset();
  showSession();
});
src.addEventListener('replay', m => {
  const list = JSON.parse(m.data);
  // Skip agents that are already gone before replaying, so they never take a
  // desk: ones that never reported back in two hours, and Gemini once its
  // last turn is older than GEMINI_STAYS.
  const lastOf = {};
  for (const e of list) lastOf[e.agent] = e;
  const end = list.length ? list[list.length - 1].t : 0, wall = Date.now() / 1000;
  const gone = id => {
    const e = lastOf[id];
    if (!e || id === 'main') return false;
    if (e.src !== 'gemini') return end - e.t > 7200;
    return e.ev === 'state' && e.state === 'done' ? wall - e.t > GEMINI_STAYS : wall - e.t > 7200;
  };
  for (const e of list) if (!gone(e.agent)) apply(e, true);
  for (const a of agents.values()) {
    if (a.kind === 'gemini' && a.act === 'done') a.leaveAt = now() + GEMINI_STAYS - (wall - a.seen);
  }
  for (const e of list.slice(-6)) {
    // Agents that already left still get their name and color from the event.
    const a = e.agent === 'main' ? main : agents.get(e.agent) ||
      (e.src === 'gemini' ? { kind: 'gemini' } : e.role && { role: e.role, name: e.name });
    if (e.ev === 'tool' || e.ev === 'msg' || e.ev === 'spawn') feed(e, a,
      e.ev === 'msg' ? '✉️ → ' + (e.to || 'Claude') : e.ev === 'spawn'
        ? (e.src === 'gemini' ? 'opens a conversation' : 'arrives at the office')
        : (ACT_ICON[e.activity] || '') + ' ' + e.tool + (e.detail ? ' ' + e.detail : ''));
  }
});
src.onmessage = m => {
  try { apply(JSON.parse(m.data), false); } catch (err) { console.error(err); }
};
</script>
<script>
  // The module above never runs if the CDN is unreachable.
  setTimeout(() => { if (!document.querySelector('#scene canvas'))
    document.getElementById('err').style.display = 'block'; }, 6000);
</script>
</body>
